[build]
  command = "python3 scripts/build_site.py"
  publish = "dist"

[build.environment]
  # This value is the public website address, never an authentication credential.
  SECRETS_SCAN_OMIT_KEYS = "CASA_PUBLIC_URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/camera"
  to = "/echo-camera.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/camera"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=()"

[[headers]]
  for = "/echo-camera.html"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
